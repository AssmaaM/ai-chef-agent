name: ai_chef_agent
description: >
  AI Chef Agent – a goal-oriented, stateful assistant chef mobile app
  built with Flutter and a deterministic finite state machine core.

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking & JSON
  http: ^1.2.0
  json_annotation: ^4.9.0

  # Local storage (SQLite + paths)
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local secure storage / encryption (for preferences & history)
  flutter_secure_storage: ^9.2.2

  # Notifications / timers (for in-app + OS alarms)
  flutter_local_notifications: ^17.2.3

  # Voice (speech in + TTS out)
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2

  # Simple state management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

